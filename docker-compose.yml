services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-observasi}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    restart: always
    ports:
      - "80:8081"
      - "8000:8081"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-observasi}
      - APP_DOMAIN=${APP_DOMAIN:-http://127.0.0.1:8000}
    depends_on:
      - db
    volumes:
      - ./observasi-karakter-core:/app
      
volumes:
  postgres_data:
