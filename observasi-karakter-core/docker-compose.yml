version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-observasi}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_LISTEN_PORT: 80
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      - db

  prefect:
    image: prefecthq/prefect:3.8-python3.11
    restart: always
    ports:
      - "${PREFECT_PORT:-4200}:4200"
    environment:
      - PREFECT_API_URL=http://0.0.0.0:4200/api
      - PREFECT_SERVER_API_HOST=0.0.0.0
      - PREFECT_API_DATABASE_CONNECTION_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-observasi}
    command: prefect server start
    depends_on:
      - db

  api:
    build: .
    restart: always
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      - PREFECT_API_URL=http://prefect:4200/api
      - APP_DOMAIN=${APP_DOMAIN:-http://127.0.0.1:8000}
    depends_on:
      - prefect
      - db
    volumes:
      - .:/app
      
volumes:
  postgres_data:
